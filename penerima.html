<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>HTML 2 - Penerima Komentar</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; }
        .card { 
            border: 1px solid #d0d7de; padding: 12px; 
            border-radius: 6px; margin-bottom: 12px; background: #f6f8fa; 
        }
        .author { font-weight: bold; color: #0969da; margin-bottom: 5px; }
        .avatar { width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
    </style>
</head>
<body>
    <h2>Daftar Komentar Masuk (dari saputrax)</h2>
    <div id="wadahKomentar">Memuat komentar dari GitHub...</div>

    <script>
        // Data repositorimu
        const USERNAME = 'bgamesid01-stack'; 
        const REPO = 'saputrax';
        const ISSUE_NUMBER = '1';

        const API_URL = `https://api.github.com/repos/${USERNAME}/${REPO}/issues/${ISSUE_NUMBER}/comments`;

        async function ambilKomentar() {
            const wadah = document.getElementById('wadahKomentar');

            try {
                const response = await fetch(API_URL);
                const comments = await response.json();

                if (!Array.isArray(comments) || comments.length === 0) {
                    wadah.innerHTML = '<i>Belum ada komentar. Coba tulis komentar pertama lewat halaman1.html!</i>';
                    return;
                }

                wadah.innerHTML = '';
                // Tampilkan dari yang terbaru
                comments.reverse().forEach(comment => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <div class="author">
                            <img src="${comment.user.avatar_url}" class="avatar"> 
                            ${comment.user.login}
                        </div>
                        <div>${comment.body}</div>
                    `;
                    wadah.appendChild(div);
                });
            } catch (error) {
                wadah.innerHTML = 'Gagal memuat data dari GitHub.';
            }
        }

        // Panggil fungsi saat halaman dibuka
        ambilKomentar();
    </script>
</body>
</html>
